<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7ff">
  <script src="theme.js"></script>
  <script src="env.js"></script>
  <title>Toko — Seminggu Satu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #0046ff; --blue-2: #0092ff; --yellow: #ffe600; --ink: #10245e;
      --bg: #f4f7ff; --card: #ffffff; --line: #e4e9f5; --muted: #6b7794;
      --ok: #0a7a3d; --ok-bg: #e9fbf0; --err: #b91c1c; --err-bg: #fee2e2;
      --shadow-card: 0 8px 20px rgba(0,30,120,.08);
      --shadow-pop: 0 20px 50px -12px rgba(0,30,120,.28);
    }
    :root[data-theme="dark"] {
      --bg: #0d1526; --card: #172035; --ink: #eaeffc; --line: #2a3550; --muted: #9fabc9;
      --ok-bg: rgba(45,206,137,.14); --err-bg: rgba(245,54,92,.14);
      --shadow-card: 0 8px 24px rgba(0,0,0,.35); --shadow-pop: 0 20px 50px -12px rgba(0,0,0,.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Open Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
    h1, h2, h3, .brand { font-family: 'Outfit', sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* padding-right ekstra -- theme.js naruh tombol toggle dark-mode
       (#ssThemeFab) fixed di top:14px;right:14px;z-index:2000, SELALU
       nutupin/nyerobot klik apapun yang kebetulan ada di pojok kanan-atas
       yang sama persis kalau nggak dikasih jarak (bug nyata yang sama kayak
       di debt.html -- lihat catatan di situ). cart-btn digeser ke kiri biar
       nggak ketiban FAB itu. */
    .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 1rem 4.25rem 1rem 1.1rem; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    .brand .paw { font-size: 1.2rem; }
    .brand small { display: block; font-size: .68rem; font-weight: 600; color: var(--muted); font-family: 'Open Sans', sans-serif; letter-spacing: .3px; }
    .cart-btn { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 13px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem; transition: transform .12s ease, box-shadow .12s ease; box-shadow: var(--shadow-card); }
    .cart-btn:active { transform: scale(.94); }
    .cart-badge { position: absolute; top: -6px; right: -6px; background: var(--blue); color: #fff; font-size: .68rem; font-weight: 800; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg); }

    /* Hero kecil -- gradient brand, sesuai seminggu-ui skill (bukan flat biru polos) */
    .hero { margin: 1rem 1.1rem 0; border-radius: 20px; padding: 1.5rem 1.4rem; background: linear-gradient(155deg,#0043f5 0%,#0092ff 55%,#00b4ff 100%); color: #fff; box-shadow: var(--shadow-pop); position: relative; overflow: hidden; }
    .hero::after { content:""; position:absolute; width:160px; height:160px; background:rgba(255,255,255,.12); border-radius:50%; top:-60px; right:-40px; }
    .hero-eyebrow { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.18); padding: .3rem .7rem; border-radius: 999px; font-size: .7rem; font-weight: 800; letter-spacing: .3px; margin-bottom: .6rem; }
    .hero h1 { font-size: 1.35rem; font-weight: 800; line-height: 1.25; max-width: 320px; position: relative; }
    .hero p { font-size: .82rem; opacity: .92; margin-top: .4rem; max-width: 300px; position: relative; }

    .chips { display: flex; gap: .5rem; overflow-x: auto; padding: 1.1rem 1.1rem .3rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; padding: .55rem 1.05rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: .83rem; cursor: pointer; white-space: nowrap; transition: all .12s ease; }
    .chip:active { transform: scale(.96); }
    .chip.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(0,70,255,.3); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 1rem; padding: .9rem 1.1rem 6rem; max-width: 1000px; margin: 0 auto; }
    .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; box-shadow: var(--shadow-card); }
    .pcard:active { transform: scale(.97); }
    .pcard .thumb { aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; position: relative; }
    .pcard .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pcard .body { padding: .8rem .9rem 1rem; }
    .pcard .name { font-weight: 700; font-size: .88rem; line-height: 1.35; margin-bottom: .4rem; min-height: 2.4em; }
    .pcard .price { color: var(--blue); font-weight: 800; font-family: 'Outfit', sans-serif; font-size: .95rem; }
    .badge { display: inline-block; font-size: .64rem; font-weight: 800; padding: .25rem .55rem; border-radius: 999px; margin-top: .45rem; letter-spacing: .2px; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.warn { background: #fef9c3; color: #854d0e; }
    .badge.sold { background: var(--err-bg); color: var(--err); }

    .skeleton { background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 50%, var(--card)) 37%, var(--line) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 18px; aspect-ratio: .78; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    /* Modal detail produk -- di tengah layar, bukan drawer */
    /* z-index 2100, BUKAN sekadar "lebih tinggi dari isi halaman" -- z-index
       cuma berlaku ANTAR-SIBLING dalam satu stacking context yang sama.
       theme.js naruh tombol toggle dark-mode fixed di z-index:2000 sebagai
       SIBLING dari overlay ini (bukan di dalamnya), jadi z-index tinggi di
       tombol close DI DALAM overlay ini nggak ada efeknya sama sekali kalau
       overlay-nya sendiri z-index-nya masih rendah -- overlay-nya sendiri
       yang harus menang dulu (lihat bug yang sama di debt.html/lightbox). */
    .modal-overlay { position: fixed; inset: 0; background: rgba(8,12,30,.55); z-index: 2100; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); width: 100%; max-width: 440px; max-height: 90vh; border-radius: 24px; overflow-y: auto; padding: 1.5rem; position: relative; box-shadow: var(--shadow-pop); animation: popIn .18s ease; }
    @keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    /* z-index 2100 -- theme.js naruh tombol toggle dark-mode fixed di
       top:14px;right:14px;z-index:2000, selalu nutupin tombol apapun di
       pojok kanan-atas yang nggak dikasih z-index lebih tinggi (bug yang
       sama kejadian berkali-kali di halaman lain, lihat catatan di
       photobooth.html/debt.html). */
    .modal-close { position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); font-size: 1.1rem; cursor: pointer; color: var(--ink); z-index: 2100; transition: transform .12s ease; }
    .modal-close:active { transform: scale(.9); }

    /* Drawer keranjang -- NEMPEL DI KANAN di layar lebar, full-screen di HP
       (lihat media query di bawah), header/body/footer pinned terpisah
       (header & footer nggak ikut scroll bareng list item -- footer jadi
       bar total harga yang floating permanen di bawah). */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(8,12,30,.5); z-index: 2100; display: none; justify-content: flex-end; }
    .drawer-overlay.open { display: flex; }
    .drawer { background: var(--card); width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; box-shadow: -16px 0 50px rgba(0,30,120,.18); animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateX(24px); opacity: .6; } to { transform: translateX(0); opacity: 1; } }
    .drawer-head { padding: 1.4rem 1.5rem 1.1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
    .drawer-head h2 { font-size: 1.15rem; }
    .drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 1.1rem 1.5rem; }
    .drawer-foot { flex: 0 0 auto; padding: 1.2rem 1.5rem calc(1.4rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--card); box-shadow: 0 -8px 24px rgba(0,30,120,.08); }

    @media (max-width: 768px) {
      .drawer { max-width: 100%; }
    }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: .4rem; }
    .field input, .field textarea, .field select { width: 100%; padding: .75rem .9rem; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; font-size: .9rem; transition: border-color .12s ease; }
    .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--blue); }
    .opt-row { display: flex; align-items: flex-start; gap: .6rem; padding: .85rem .95rem; border: 1.5px solid var(--line); border-radius: 15px; margin-bottom: .6rem; cursor: pointer; transition: all .12s ease; }
    .opt-row.selected { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 6%, var(--card)); box-shadow: 0 4px 14px rgba(0,70,255,.12); }
    .opt-row .ohead { display: flex; justify-content: space-between; width: 100%; font-weight: 700; font-size: .88rem; gap: .5rem; }
    .opt-row .osub { font-size: .75rem; color: var(--muted); margin-top: .2rem; line-height: 1.4; }

    .btn { border: none; border-radius: 13px; padding: .9rem; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: .95rem; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease, opacity .12s ease; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 10px 24px -6px rgba(0,70,255,.45); }
    .btn-yellow { background: var(--yellow); color: var(--ink); box-shadow: 0 10px 24px -8px rgba(255,230,0,.5); }
    .btn-ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }

    .qty-row { display: flex; align-items: center; gap: .8rem; }
    .qty-row button { width: 38px; height: 38px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--bg); font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: transform .1s ease; }
    .qty-row button:active { transform: scale(.92); }

    .cart-item { display: flex; justify-content: space-between; gap: .7rem; padding: .95rem 0; border-bottom: 1px solid var(--line); }
    .cart-item:last-child { border-bottom: none; }
    .cart-item .ci-name { font-weight: 700; font-size: .88rem; }
    .cart-item .ci-sub { font-size: .76rem; color: var(--muted); margin-top: .1rem; }
    .cart-item .ci-price { font-weight: 800; color: var(--blue); white-space: nowrap; font-family: 'Outfit', sans-serif; }
    .cart-item .ci-remove { border: none; background: none; color: var(--err); font-size: .74rem; font-weight: 700; cursor: pointer; margin-top: .3rem; padding: 0; }
    .row-total { display: flex; justify-content: space-between; padding: .3rem 0; font-size: .88rem; color: var(--muted); }
    .row-total.grand { font-weight: 800; font-size: 1.05rem; color: var(--ink); border-top: 1px solid var(--line); margin-top: .3rem; padding-top: .8rem; }

    .bank-box { background: var(--card); border: 1.5px dashed var(--blue); border-radius: 15px; padding: 1rem 1.1rem; margin-bottom: 1.1rem; font-size: .85rem; line-height: 1.6; }
    .bank-box .bnum { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--blue); }

    .hint { font-size: .76rem; color: var(--muted); margin-top: .35rem; line-height: 1.5; }
    .empty { text-align: center; padding: 3.5rem 1rem; color: var(--muted); font-size: .88rem; }
    .empty .emoji { font-size: 2.4rem; display: block; margin-bottom: .6rem; }
    .msg { font-size: .85rem; font-weight: 700; text-align: center; margin-top: .7rem; min-height: 1.2em; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }

    /* Toast */
    #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: .8rem 1.2rem; border-radius: 13px; font-size: .85rem; font-weight: 700; box-shadow: var(--shadow-pop); z-index: 60; opacity: 0; pointer-events: none; transition: all .25s ease; display: flex; align-items: center; gap: 8px; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 640px) { .hero h1, .hero p { max-width: none; } }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand"><span class="paw">🐾</span><span>Toko Seminggu Satu<small>Journaling kit & stationery</small></span></div>
    <button class="cart-btn" id="cartBtn">🛍️<span class="cart-badge" id="cartBadge" style="display:none;">0</span></button>
  </div>

  <div class="hero">
    <span class="hero-eyebrow">✨ Jalan online ke komunitas</span>
    <h1>Belanja journaling kit, bisa sekalian gabung komunitas</h1>
    <p>Pilih "Kit + Akses Komunitas" buat ikut sesi Zoom bareng & aktivasi akun warga.</p>
  </div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>

  <!-- Product detail -->
  <div class="modal-overlay" id="productOverlay">
    <div class="modal-box">
      <button class="modal-close" id="productClose">&times;</button>
      <div id="productContent"></div>
    </div>
  </div>

  <!-- Cart / checkout -- drawer nempel di kanan -->
  <div class="drawer-overlay" id="cartOverlay">
    <div class="drawer">
      <div class="drawer-head">
        <h2 id="drawerTitle">Keranjang</h2>
        <button class="modal-close" id="cartClose" style="position:relative;top:0;right:0;z-index:2100;">&times;</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot" id="drawerFoot"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const state = { products: [], kitSessions: [], cart: [], filter: 'all', checkoutMode: false, orderDone: false };
    const DEFAULT_BANK = { name: 'BCA', account: '6042825961', holder: 'Arnold Therigan' }; // sama default yang dipakai semua halaman workshop

    function rupiah(n) { return 'Rp ' + (Number(n) || 0).toLocaleString('id-ID'); }
    function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    let _toastTimer = null;
    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function loadCatalog() {
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/shop-catalog`, { headers: { apikey: SUPABASE_ANON_KEY } });
        const data = await res.json();
        state.products = data.products || [];
        state.kitSessions = data.kitSessions || [];
        renderChips();
        renderGrid();
      } catch (e) {
        document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;"><span class="emoji">😵</span>Gagal memuat produk. Coba refresh ya.</div>';
      }
    }

    function renderChips() {
      const cats = [...new Set(state.products.map(p => p.category))];
      const labels = { kit: 'Journaling Kit', decopaper: 'Decopaper', washitape: 'Washi Tape', stamp: 'Stamp Set', memopad: 'Memo Pad', sticker: 'Sticker' };
      const el = document.getElementById('chips');
      el.innerHTML = ['all', ...cats].map(c =>
        `<button class="chip ${c === state.filter ? 'active' : ''}" data-cat="${c}">${c === 'all' ? 'Semua' : (labels[c] || c)}</button>`
      ).join('');
      el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { state.filter = b.dataset.cat; renderChips(); renderGrid(); }));
    }

    function productPriceLabel(p) {
      // Kit: variannya cuma opsi UPSELL (bundle Zoom), bukan pilihan motif/stok
      // kayak produk lain -- harga yang ditampilin di kartu katalog harus tetap
      // harga "Kit Saja" (basePrice), bukan ikut-ikutan dihitung dari harga
      // bundle yang lebih mahal.
      if (p.isKit || !p.variants.length) return rupiah(p.basePrice);
      const prices = p.variants.map(v => v.price != null ? v.price : p.basePrice);
      const min = Math.min(...prices), max = Math.max(...prices);
      return min === max ? rupiah(min) : `${rupiah(min)} - ${rupiah(max)}`;
    }

    function stockBadge(p) {
      // Kit nggak punya "stok fisik" kayak decopaper/stiker -- variannya cuma
      // opsi bundle (stock_qty-nya sengaja null = "nggak dibatasin fisik"),
      // BUKAN berarti "pre-order". Jangan pakai logic stok generik di sini.
      if (p.isKit) return '<span class="badge ok">✨ Bisa Bundle Komunitas</span>';
      if (!p.variants.length) return '';
      const allSoldOut = p.variants.every(v => v.soldOut);
      if (allSoldOut) return '<span class="badge sold">Habis</span>';
      const anyPreorder = p.variants.some(v => v.isPreorder);
      if (anyPreorder) return '<span class="badge warn">Ada Pre-Order</span>';
      return '<span class="badge ok">Ready Stock</span>';
    }

    function renderGrid() {
      const el = document.getElementById('grid');
      const list = state.filter === 'all' ? state.products : state.products.filter(p => p.category === state.filter);
      if (!list.length) { el.innerHTML = '<div class="empty" style="grid-column:1/-1;"><span class="emoji">📭</span>Belum ada produk di kategori ini.</div>'; return; }
      el.innerHTML = list.map(p => `
        <div class="pcard" data-id="${p.id}">
          <div class="thumb">${p.imageUrl ? `<img src="${p.imageUrl}" alt="${escapeHtml(p.name)}">` : '📦'}</div>
          <div class="body">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="price">${productPriceLabel(p)}</div>
            ${stockBadge(p)}
          </div>
        </div>
      `).join('');
      el.querySelectorAll('.pcard').forEach(c => c.addEventListener('click', () => openProduct(c.dataset.id)));
    }

    // ---------- Product detail / add to cart ----------
    let _activeProduct = null;
    function openProduct(id) {
      const p = state.products.find(x => x.id === id);
      if (!p) return;
      _activeProduct = p;
      const hasVariants = p.variants.length > 0;
      const soldOutAll = hasVariants && p.variants.every(v => v.soldOut);

      let variantHtml = '';
      if (p.isKit) {
        variantHtml = `
          <div class="field"><label>Pilih Opsi</label>
            <div class="opt-row selected" data-kit="0">
              <div style="flex:1;"><div class="ohead"><span>Kit Saja</span><span>${rupiah(p.basePrice)}</span></div>
              <div class="osub">Journaling kit lengkap, tanpa sesi Zoom.</div></div>
            </div>
            <div class="opt-row" data-kit="1">
              <div style="flex:1;"><div class="ohead"><span>Kit + Akses Komunitas ✨</span><span>${rupiah((p.variants[0] && p.variants[0].price) || p.basePrice)}</span></div>
              <div class="osub">Ikut sesi Zoom crafting bareng + nomor WA kamu jadi bisa aktivasi akun warga.</div></div>
            </div>
          </div>
          <div class="field" id="kitSessionField" style="display:none;"><label>Jadwal Sesi Zoom</label>
            <select id="kitSessionSelect">${state.kitSessions.map(s => `<option value="${s.id}">${escapeHtml(s.label)}${s.remaining != null ? ` (sisa ${s.remaining})` : ''}</option>`).join('') || '<option value="">Belum ada jadwal dibuka</option>'}</select>
          </div>
        `;
      } else if (hasVariants) {
        variantHtml = `<div class="field"><label>Pilih Varian</label>` +
          p.variants.map((v, i) => `
            <div class="opt-row ${i === 0 && !v.soldOut ? 'selected' : ''}" data-variant="${v.id}" style="${v.soldOut ? 'opacity:.5;pointer-events:none;' : ''}">
              <div style="flex:1;"><div class="ohead"><span>${escapeHtml(v.label)}</span><span>${rupiah(v.price != null ? v.price : p.basePrice)}</span></div>
              <div class="osub">${v.soldOut ? 'Habis' : v.isPreorder ? 'Pre-Order 3 hari' : 'Ready Stock'}</div></div>
            </div>
          `).join('') + `</div>`;
      }

      document.getElementById('productContent').innerHTML = `
        <div style="aspect-ratio:4/3;background:var(--bg);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:1.1rem;overflow:hidden;">
          ${p.imageUrl ? `<img src="${p.imageUrl}" style="width:100%;height:100%;object-fit:cover;">` : '📦'}
        </div>
        <h2 style="font-size:1.25rem;margin-bottom:.35rem;">${escapeHtml(p.name)}</h2>
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.5;">${escapeHtml(p.description || '')}</p>
        ${variantHtml}
        ${!p.isKit ? `<div class="field"><label>Jumlah</label><div class="qty-row"><button id="qtyMinus">-</button><span id="qtyVal" style="font-weight:800;min-width:24px;text-align:center;">1</span><button id="qtyPlus">+</button></div></div>` : ''}
        <button class="btn btn-primary" id="addToCartBtn" ${soldOutAll ? 'disabled' : ''}>${soldOutAll ? 'Stok Habis' : 'Masukkan Keranjang'}</button>
      `;

      let selectedVariantId = hasVariants ? (p.variants.find(v => !v.soldOut) || {}).id : null;
      let selectedKitBundle = false;
      let qty = 1;

      document.getElementById('productContent').querySelectorAll('[data-variant]').forEach(row => {
        row.addEventListener('click', () => {
          document.getElementById('productContent').querySelectorAll('[data-variant]').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          selectedVariantId = row.dataset.variant;
        });
      });
      document.getElementById('productContent').querySelectorAll('[data-kit]').forEach(row => {
        row.addEventListener('click', () => {
          document.getElementById('productContent').querySelectorAll('[data-kit]').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          selectedKitBundle = row.dataset.kit === '1';
          selectedVariantId = selectedKitBundle ? (p.variants[0] && p.variants[0].id) : null;
          document.getElementById('kitSessionField').style.display = selectedKitBundle ? 'block' : 'none';
        });
      });
      const qtyMinus = document.getElementById('qtyMinus'), qtyPlus = document.getElementById('qtyPlus'), qtyVal = document.getElementById('qtyVal');
      if (qtyMinus) qtyMinus.addEventListener('click', () => { qty = Math.max(1, qty - 1); qtyVal.textContent = qty; });
      if (qtyPlus) qtyPlus.addEventListener('click', () => { qty++; qtyVal.textContent = qty; });

      document.getElementById('addToCartBtn').addEventListener('click', () => {
        const kitSessionSelect = document.getElementById('kitSessionSelect');
        if (selectedKitBundle && (!kitSessionSelect || !kitSessionSelect.value)) { alert('Pilih jadwal sesi Zoom dulu ya.'); return; }
        const variant = hasVariants ? p.variants.find(v => v.id === selectedVariantId) : null;
        state.cart.push({
          productId: p.id, variantId: variant ? variant.id : null,
          name: p.name, variantLabel: variant ? variant.label : '',
          price: variant && variant.price != null ? variant.price : p.basePrice,
          quantity: p.isKit ? 1 : qty,
          includesCommunityBundle: !!selectedKitBundle,
          kitSessionId: selectedKitBundle ? kitSessionSelect.value : null,
        });
        updateCartBadge();
        closeProduct();
        showToast(`✅ ${p.name} ditambahkan ke keranjang`);
      });

      document.getElementById('productOverlay').classList.add('open');
    }
    function closeProduct() { document.getElementById('productOverlay').classList.remove('open'); }
    document.getElementById('productClose').addEventListener('click', closeProduct);
    document.getElementById('productOverlay').addEventListener('click', e => { if (e.target.id === 'productOverlay') closeProduct(); });

    // ---------- Cart / Checkout (drawer nempel kanan) ----------
    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      const count = state.cart.reduce((s, i) => s + i.quantity, 0);
      badge.textContent = count;
      badge.style.display = count ? 'flex' : 'none';
    }
    function cartSubtotal() { return state.cart.reduce((s, i) => s + i.price * i.quantity, 0); }

    function openCart() {
      state.checkoutMode = false; state.orderDone = false; renderCart();
      document.getElementById('cartOverlay').classList.add('open');
      document.getElementById('toast').classList.remove('show'); // jangan numpuk di atas drawer yang baru dibuka
    }
    function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); }
    document.getElementById('cartBtn').addEventListener('click', openCart);
    document.getElementById('cartClose').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', e => { if (e.target.id === 'cartOverlay') closeCart(); });

    function renderCart() {
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      const foot = document.getElementById('drawerFoot');

      if (state.orderDone) { title.textContent = 'Pesanan Terkirim'; foot.innerHTML = ''; return; } // isinya udah di-render submitOrder()
      if (state.checkoutMode) { renderCheckoutForm(); return; }

      title.textContent = 'Keranjang';
      if (!state.cart.length) {
        body.innerHTML = '<div class="empty"><span class="emoji">🛍️</span>Keranjang masih kosong.<br>Yuk belanja dulu!</div>';
        foot.innerHTML = '';
        return;
      }
      const subtotal = cartSubtotal();
      body.innerHTML = state.cart.map((it, i) => `
        <div class="cart-item">
          <div><div class="ci-name">${escapeHtml(it.name)}</div>
          <div class="ci-sub">${it.includesCommunityBundle ? 'Kit + Akses Komunitas' : escapeHtml(it.variantLabel || '')} ${it.quantity > 1 ? `· x${it.quantity}` : ''}</div>
          <button data-remove="${i}" class="ci-remove">Hapus</button></div>
          <div class="ci-price">${rupiah(it.price * it.quantity)}</div>
        </div>`).join('');
      body.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => { state.cart.splice(Number(b.dataset.remove), 1); updateCartBadge(); renderCart(); }));

      foot.innerHTML = `
        <div class="row-total grand"><span>Subtotal</span><span>${rupiah(subtotal)}</span></div>
        <p style="font-size:.74rem;color:var(--muted);margin:.5rem 0 1rem;line-height:1.5;">Ongkos kirim belum termasuk -- admin bakal konfirmasi total akhir + ongkir via WA setelah pesanan diterima.</p>
        <button class="btn btn-primary" id="toCheckoutBtn">Lanjut Checkout</button>
      `;
      document.getElementById('toCheckoutBtn').addEventListener('click', () => { state.checkoutMode = true; renderCart(); });
    }

    // HEIC-aware compress, sama pola kayak qCompress() di admin/index.html.
    function isHeicFile(f) { return /heic|heif/i.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || ''); }
    async function heicToJpeg(file) {
      if (!window.heic2any) {
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
          s.onload = res; s.onerror = () => rej(new Error('gagal load konverter HEIC'));
          document.head.appendChild(s);
        });
      }
      const out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
      return Array.isArray(out) ? out[0] : out;
    }
    async function compressImage(file, maxSize, quality) {
      if (isHeicFile(file)) file = await heicToJpeg(file);
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxSize) { h *= maxSize / w; w = maxSize; } } else { if (h > maxSize) { w *= maxSize / h; h = maxSize; } }
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject; img.src = ev.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

    // Ongkir Fase 2: alamat tujuan harus dicocokin ke id RajaOngkir dulu
    // (server cuma ngerti level kelurahan/kecamatan, bukan teks bebas),
    // baru layanan JNE-nya bisa dihitung & dipilih.
    let _coDest = null; // {id, label}
    let _coService = null; // {service, description, cost, etd}
    let _coSearchTimer = null;

    function updateCheckoutTotal() {
      const subtotal = cartSubtotal();
      const shipping = _coService ? _coService.cost : 0;
      const el = document.getElementById('coTotalLine');
      if (el) el.innerHTML = _coService
        ? `Ongkir (${_coService.service}): <strong>${rupiah(shipping)}</strong><br>Total: <strong>${rupiah(subtotal + shipping)}</strong>`
        : `Total: <strong>${rupiah(subtotal)}</strong> <span style="color:var(--muted);">(belum termasuk ongkir)</span>`;
    }

    function renderCheckoutForm() {
      document.getElementById('drawerTitle').textContent = 'Checkout';
      const body = document.getElementById('drawerBody');
      const foot = document.getElementById('drawerFoot');
      body.innerHTML = `
        <div class="bank-box">
          Transfer ke:<br>
          <span class="bnum">${DEFAULT_BANK.name} ${DEFAULT_BANK.account}</span><br>
          a.n ${DEFAULT_BANK.holder}<br>
          <span id="coTotalLine"></span>
        </div>
        <div class="field"><label>Nomor WhatsApp</label><input type="tel" id="coWa" placeholder="08xxxxxxxxxx"></div>
        <div class="field"><label>Nama Penerima</label><input type="text" id="coName"></div>
        <div class="field">
          <label>📦 Cek Ongkir -- Kelurahan/Kecamatan Tujuan</label>
          <p class="hint" style="margin-top:0;margin-bottom:.5rem;">Dipakai buat hitung ongkir JNE otomatis -- cukup nama kelurahan/kecamatan, BUKAN alamat lengkap (itu ada di kolom bawah).</p>
          <input type="text" id="coDestSearch" placeholder="Ketik min. 3 huruf, mis. &quot;Pesanggrahan&quot;" autocomplete="off">
          <div id="coDestResults"></div>
        </div>
        <div class="field"><label>Detail Alamat (jalan, nomor rumah, RT/RW)</label><textarea id="coAddress" rows="2" placeholder="Jl. ..., No. ..., RT/RW ..."></textarea></div>
        <div class="field" id="coShippingField" style="display:none;"><label>Pilih Layanan JNE</label><div id="coShippingOptions"></div></div>
        <div class="field"><label>Bukti Transfer</label><input type="file" accept="image/*" id="coProof"></div>
        <div class="msg" id="checkoutMsg"></div>
      `;
      foot.innerHTML = `
        <button class="btn btn-yellow" id="submitOrderBtn">Kirim Pesanan</button>
        <button class="btn btn-ghost" id="backToCartBtn" style="margin-top:.6rem;">← Kembali ke Keranjang</button>
      `;
      updateCheckoutTotal();
      document.getElementById('backToCartBtn').addEventListener('click', () => { state.checkoutMode = false; renderCart(); });
      document.getElementById('submitOrderBtn').addEventListener('click', submitOrder);

      document.getElementById('coDestSearch').addEventListener('input', (e) => {
        _coDest = null; _coService = null;
        document.getElementById('coShippingField').style.display = 'none';
        updateCheckoutTotal();
        clearTimeout(_coSearchTimer);
        const q = e.target.value.trim();
        const resultsEl = document.getElementById('coDestResults');
        if (q.length < 3) { resultsEl.innerHTML = ''; return; }
        _coSearchTimer = setTimeout(async () => {
          resultsEl.innerHTML = '<p class="hint" style="font-size:.75rem;color:var(--muted);margin-top:.3rem;">Mencari...</p>';
          try {
            const res = await fetch(`${SUPABASE_URL}/functions/v1/shop-ongkir`, {
              method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
              body: JSON.stringify({ action: 'search', query: q }),
            });
            const data = await res.json();
            const results = (data.results || []).slice(0, 6);
            if (!results.length) { resultsEl.innerHTML = '<p class="hint" style="font-size:.75rem;color:var(--muted);margin-top:.3rem;">Nggak ketemu, coba kata kunci lain.</p>'; return; }
            resultsEl.innerHTML = results.map((r, i) => `<div class="opt-row" style="padding:.6rem .8rem;margin-bottom:.4rem;" data-destidx="${i}"><div class="osub" style="margin:0;">${escapeHtml(r.label)}</div></div>`).join('');
            resultsEl.querySelectorAll('[data-destidx]').forEach(row => {
              row.addEventListener('click', () => {
                _coDest = results[Number(row.dataset.destidx)];
                document.getElementById('coDestSearch').value = _coDest.label;
                resultsEl.innerHTML = '';
                calcShipping();
              });
            });
          } catch (e) { resultsEl.innerHTML = '<p class="hint" style="font-size:.75rem;color:var(--err);margin-top:.3rem;">Gagal mencari, coba lagi.</p>'; }
        }, 400);
      });
    }

    async function calcShipping() {
      if (!_coDest) return;
      const field = document.getElementById('coShippingField');
      const optsEl = document.getElementById('coShippingOptions');
      field.style.display = 'block';
      optsEl.innerHTML = '<p class="hint" style="font-size:.8rem;color:var(--muted);">Menghitung ongkir...</p>';
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/shop-ongkir`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({ action: 'cost', destinationId: _coDest.id, items: state.cart.map(i => ({ productId: i.productId, quantity: i.quantity })) }),
        });
        const data = await res.json();
        if (data.status !== 'success' || !data.options.length) { optsEl.innerHTML = `<p class="msg err">${data.message || 'JNE nggak tersedia buat tujuan ini.'}</p>`; return; }
        optsEl.innerHTML = data.options.map((o, i) => `
          <div class="opt-row ${i === 0 ? 'selected' : ''}" data-svcidx="${i}">
            <div style="flex:1;"><div class="ohead"><span>JNE ${escapeHtml(o.service)}</span><span>${rupiah(o.cost)}</span></div>
            <div class="osub">${escapeHtml(o.description)} · estimasi ${escapeHtml(o.etd)} hari</div></div>
          </div>
        `).join('');
        _coService = data.options[0];
        updateCheckoutTotal();
        optsEl.querySelectorAll('[data-svcidx]').forEach(row => {
          row.addEventListener('click', () => {
            optsEl.querySelectorAll('[data-svcidx]').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
            _coService = data.options[Number(row.dataset.svcidx)];
            updateCheckoutTotal();
          });
        });
      } catch (e) { optsEl.innerHTML = '<p class="msg err">Gagal menghitung ongkir, coba lagi.</p>'; }
    }

    async function submitOrder() {
      const msg = document.getElementById('checkoutMsg');
      const wa = document.getElementById('coWa').value.trim();
      const name = document.getElementById('coName').value.trim();
      const address = document.getElementById('coAddress').value.trim();
      const proofFile = document.getElementById('coProof').files[0];
      if (!wa || !name || !address) { msg.textContent = 'Lengkapi semua data dulu ya.'; msg.className = 'msg err'; return; }
      if (!_coDest) { msg.textContent = 'Pilih kelurahan/kecamatan tujuan dulu ya.'; msg.className = 'msg err'; return; }
      if (!_coService) { msg.textContent = 'Pilih layanan JNE dulu ya.'; msg.className = 'msg err'; return; }
      if (!proofFile) { msg.textContent = 'Upload bukti transfer dulu ya.'; msg.className = 'msg err'; return; }

      const btn = document.getElementById('submitOrderBtn');
      btn.disabled = true; btn.textContent = 'Mengirim...';
      msg.textContent = ''; msg.className = 'msg';

      try {
        const dataUrl = await compressImage(proofFile, 1200, 0.82);
        const base64 = dataUrl.split(',')[1];
        // Phase 1: satu order per baris keranjang (backend-nya nerima banyak
        // item sekaligus per order -- di sini kita kirim SEMUA baris cart
        // jadi 1 pesanan, kecuali yg bundle komunitas beda sesi/produk ya
        // tetap campur dalam 1 order, itemsnya yg beda-beda).
        const bundleItem = state.cart.find(i => i.includesCommunityBundle);
        const res = await fetch(`${SUPABASE_URL}/functions/v1/shop-create-order`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({
            wa, customerName: name,
            items: state.cart.map(i => ({ productId: i.productId, variantId: i.variantId, quantity: i.quantity })),
            shippingAddress: { recipient: name, phone: wa, address, destinationId: _coDest.id, destinationLabel: _coDest.label },
            courierService: _coService.service,
            paymentBase64: base64,
            includesCommunityBundle: !!bundleItem,
            kitSessionId: bundleItem ? bundleItem.kitSessionId : null,
          }),
        });
        const data = await res.json();
        if (data.status !== 'success') { msg.textContent = data.message || 'Gagal membuat pesanan.'; msg.className = 'msg err'; btn.disabled = false; btn.textContent = 'Kirim Pesanan'; return; }

        state.orderDone = true;
        document.getElementById('drawerTitle').textContent = 'Pesanan Terkirim';
        document.getElementById('drawerBody').innerHTML = `
          <div class="empty"><span class="emoji">✅</span>
          <strong style="color:var(--ink);">Kode pesanan: ${data.orderCode}</strong>
          <p style="margin-top:.6rem;">Admin bakal cek bukti transfernya. Pantau statusnya lewat halaman Lacak Pesanan pakai nomor WA yang sama.</p></div>
        `;
        document.getElementById('drawerFoot').innerHTML = `<a href="toko/lacak.html" class="btn btn-primary" style="text-decoration:none;">Lacak Pesanan</a>`;
        state.cart = []; updateCartBadge();
      } catch (e) {
        msg.textContent = 'Terjadi kesalahan, coba lagi ya.'; msg.className = 'msg err';
        btn.disabled = false; btn.textContent = 'Kirim Pesanan';
      }
    }

    loadCatalog();
  </script>
</body>
