<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Airwaves 📻</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f3ed">

  <script src="../env.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f7f3ed;
      --card-bg: #ffffff;
      --text-main: #332c27;
      --text-muted: #7a6e65;
      --accent-brown: #a87d65;
      --border-radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 28px 16px 60px;
      background-image: radial-gradient(#e2d9cd 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .wrap { max-width: 460px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 22px; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--accent-brown); margin-bottom: 6px; }
    header p { font-size: 0.88rem; color: var(--text-muted); }

    .tape-card {
      background: var(--card-bg);
      border: 1px solid #ebd8c7;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }
    .tape-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .tape-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #332c27; flex-shrink: 0; }
    .tape-label { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }
    audio { width: 100%; }

    .state-box { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); }
    .state-box .emoji { font-size: 2.2rem; margin-bottom: 10px; }

    .reload-btn {
      display: block; margin: 0 auto 20px; padding: 10px 20px;
      border-radius: 999px; border: 2px solid #332c27; background: #fff;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
    }
    .reload-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Community Airwaves 📻</h1>
      <p>Kaset yang dibagikan anonim -- Reka Rekat Vol 6</p>
    </header>
    <button class="reload-btn" onclick="load()">🔄 Reload</button>
    <div id="list"><div class="state-box">Memuat…</div></div>
  </div>

  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    async function load() {
      const listEl = document.getElementById("list");
      listEl.innerHTML = '<div class="state-box">Memuat…</div>';
      try {
        const res = await fetch(SUPABASE_URL + "/functions/v1/journaling-tape", {
          headers: { apikey: SUPABASE_ANON_KEY },
        });
        const body = await res.json();
        if (!res.ok || body.status === "error") {
          listEl.innerHTML = '<div class="state-box"><div class="emoji">😢</div>Gagal memuat. Coba reload ya.</div>';
          return;
        }
        const tapes = body.tapes || [];
        if (!tapes.length) {
          listEl.innerHTML = '<div class="state-box"><div class="emoji">📭</div>Belum ada kaset yang dibagikan.</div>';
          return;
        }
        listEl.innerHTML = tapes.map((t, i) => `
          <div class="tape-card">
            <div class="tape-head">
              <div class="tape-dot" style="background:${esc(t.color || '#ccc')};"></div>
              <div class="tape-label">Kaset #${i + 1}</div>
            </div>
            <audio controls preload="none" src="${esc(t.audioUrl)}"></audio>
          </div>
        `).join("");
      } catch (e) {
        listEl.innerHTML = '<div class="state-box"><div class="emoji">😢</div>Koneksi gagal. Coba reload ya.</div>';
      }
    }
    load();
  </script>
</body>
</html>
