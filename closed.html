<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#0d1526">
    <script src="theme.js"></script>
    <title>Pendaftaran Ditutup — Seminggu Satu by Arnold</title>
    <meta name="description" content="Pendaftaran workshop sedang tidak tersedia. Follow Instagram kami untuk info workshop selanjutnya.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Workshop Config -->
    <script src="workshop-config.js?v=3"></script>

    <style>
        :root {
            --bg-color: #faf9f7;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent: #3b82f6;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }

        /* ---- Dark mode ---- */
        :root[data-theme="dark"] {
            --bg-color: #0d1526;
            --text-primary: #eaeffc;
            --text-secondary: #9fabc9;
            --border-color: #2a3550;
        }
        :root[data-theme="dark"] .card,
        :root[data-theme="dark"] .date-info,
        :root[data-theme="dark"] .social-btn { background: #172035; color: var(--text-primary); }
        :root[data-theme="dark"] .brand-logo { filter: invert(1); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        .brand {
            margin-bottom: 2.5rem;
            animation: fadeIn 0.5s ease both;
        }

        .brand a {
            text-decoration: none;
        }

        .brand-logo {
            height: 112px;
            width: auto;
            max-width: 280px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .brand p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.35rem;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s ease 0.1s both;
        }

        .icon-wrap {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-wrap i {
            width: 38px;
            height: 38px;
        }

        .icon-wrap.icon-closed {
            background: #fef2f2;
        }

        .icon-wrap.icon-closed i {
            color: var(--error-color);
        }

        .icon-wrap.icon-not-open {
            background: #fffbeb;
        }

        .icon-wrap.icon-not-open i {
            color: var(--warning-color);
        }

        .icon-wrap.icon-disabled {
            background: #f3f4f6;
        }

        .icon-wrap.icon-disabled i {
            color: var(--text-secondary);
        }

        .closed-mochi {
            width: 110px;
            margin: 0 auto 1.25rem;
            display: block;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .workshop-name {
            font-weight: 700;
            color: var(--text-primary);
        }

        .divider {
            width: 40px;
            height: 3px;
            border-radius: 99px;
            margin: 0 auto 1.5rem;
            opacity: 0.5;
        }

        .divider-red { background: var(--error-color); }
        .divider-yellow { background: var(--warning-color); }
        .divider-gray { background: var(--text-secondary); }

        p.desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: 1.5rem;
        }

        .date-info {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #f9fafb;
            padding: 0.6rem 1.25rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.75rem;
            border: 1px solid var(--border-color);
        }

        .date-info i {
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
        }

        .see-you {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--text-primary);
            color: white;
            border: none;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            margin-bottom: 1.5rem;
            font-family: inherit;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .back-btn i { width: 16px; height: 16px; }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            background: white;
            border: 1.5px solid var(--border-color);
            border-radius: 99px;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: var(--bg-color);
            transform: translateY(-1px);
        }

        .social-btn i { width: 16px; height: 16px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Dunia visual Binder Diary (sama dengan Home & form pendaftaran) -->
    <style>
        :root { --bg-color: #f4f7ff; --text-primary: #10245e; --text-secondary: #4a5674; --border-color: #d6e3ff;
            --paper: #ffffff; --margin-line: #ff8fb8; --tint: 16, 36, 94; --peel: #dfe7fb;
            --depth-paper: 0 1px 2px rgba(16,36,94,.10), 0 6px 16px rgba(16,36,94,.06);
            --depth-sticker: 0 0 0 3px #ffffff, 0 4px 8px rgba(16,36,94,.22); }
        :root[data-theme="dark"] { --bg-color: #0d1526; --text-primary: #eaeffc; --text-secondary: #9fabc9; --border-color: #27355e;
            --paper: #18213b; --margin-line: #b85a82; --tint: 0, 0, 0; --peel: #33467a;
            --depth-paper: 0 1px 2px rgba(0,0,0,.5), 0 8px 18px rgba(0,0,0,.35);
            --depth-sticker: 0 0 0 3px #ffffff, 0 4px 10px rgba(0,0,0,.5); }
        ::selection { background: #ffe600; color: #10245e; }
        body { font-family: 'Open Sans', -apple-system, sans-serif;
            background-image: radial-gradient(rgba(var(--tint), .09) 1px, transparent 1.2px); background-size: 22px 22px; }
        :root[data-theme="dark"] body { background-image: radial-gradient(rgba(234,239,252,.06) 1px, transparent 1.2px); }
        h2 { font-weight: 800; color: var(--text-primary); }
        .brand a { display: inline-grid; grid-template-columns: auto auto; column-gap: .6rem; align-items: center; text-align: left;
            background: #fff; padding: .5rem .95rem .5rem .55rem; border-radius: 12px; box-shadow: var(--depth-sticker); transform: rotate(-2deg); }
        .brand-logo, :root[data-theme="dark"] .brand-logo { grid-row: 1 / span 2; width: 54px; height: 54px; max-width: none; margin: 0; filter: none; }
        .brand a::before { content: "Seminggu Satu"; content: "Seminggu Satu" / ""; grid-column: 2; align-self: end;
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; line-height: 1; letter-spacing: -.02em; color: #10245e; }
        .brand p { grid-column: 2; align-self: start; margin: .15rem 0 0; color: #0046ff; font-family: 'Outfit', sans-serif;
            font-weight: 800; text-transform: none; letter-spacing: 0; font-size: .85rem; }
        /* kartu = lembar loose-leaf */
        .card, :root[data-theme="dark"] .card { position: relative; background-color: var(--paper); color: var(--text-primary);
            background-image: linear-gradient(to right, transparent 36px, var(--margin-line) 36px, var(--margin-line) 38px, transparent 38px);
            border: none; border-radius: 6px 16px 16px 6px; box-shadow: var(--depth-paper); padding: 2.25rem 1.5rem 2rem 3.4rem; }
        .card::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 18px; width: 16px; pointer-events: none;
            background: radial-gradient(circle, var(--bg-color) 5.5px, rgba(var(--tint), .22) 6px, transparent 7.5px) top / 16px 16px no-repeat,
                radial-gradient(circle, var(--bg-color) 5.5px, rgba(var(--tint), .22) 6px, transparent 7.5px) center / 16px 16px no-repeat,
                radial-gradient(circle, var(--bg-color) 5.5px, rgba(var(--tint), .22) 6px, transparent 7.5px) bottom / 16px 16px no-repeat; }
        .closed-mochi { transform: rotate(-6deg);
            filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 5px rgba(var(--tint), .3)); }
        .icon-wrap { box-shadow: var(--depth-sticker); transform: rotate(-6deg); }
        .divider { height: 4px; opacity: 1; background: #ff8fb8 !important; transform: rotate(-2deg); }
        .date-info, :root[data-theme="dark"] .date-info { background: #fff6a8; color: #10245e; border: none; border-radius: 2px;
            box-shadow: var(--depth-paper); transform: rotate(-1deg); }
        .date-info i, .date-info svg { color: #10245e; }
        .back-btn { position: relative; min-height: 48px; background: #0046ff; color: #fff; border-radius: 14px; padding: .8rem 1.5rem;
            font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1rem; box-shadow: var(--depth-sticker); transform: rotate(-.8deg); }
        .back-btn::after { content: ""; position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 0 0 14px 0;
            background: linear-gradient(315deg, var(--paper) 0 48%, var(--peel) 50% 100%); transition: width .2s ease, height .2s ease; }
        .back-btn:hover { transform: rotate(-1.4deg) translateY(-2px); box-shadow: var(--depth-sticker); }
        .back-btn:hover::after, .back-btn:active::after { width: 26px; height: 26px; }
        .back-btn:focus-visible, .social-btn:focus-visible { outline: 3px solid #0046ff; outline-offset: 3px; }
        .social-btn, :root[data-theme="dark"] .social-btn { min-height: 44px; background: #fff; color: #10245e; border: none;
            box-shadow: 0 3px 8px rgba(var(--tint), .18); font-weight: 700; }
        .social-btn:nth-child(1) { transform: rotate(-1.5deg); }
        .social-btn:nth-child(2) { transform: rotate(1.5deg); }
        .social-btn:hover { background: #fff; transform: rotate(0) translateY(-2px); }
    </style>
</head>

<body>

    <div class="brand">
        <a href="index.html" style="text-decoration:none;">
            <img src="images/logo-paw-tight.png" alt="Seminggu Satu" class="brand-logo" width="240" height="240">
            <p>by Arnold</p>
        </a>
    </div>

    <div class="card" id="closedCard">
        <!-- Content rendered by JS based on query params -->
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const workshopId = params.get('workshop');
        const reason = params.get('reason') || 'disabled';

        const workshop = getWorkshopById(workshopId);
        const workshopName = workshop ? workshop.name : 'Workshop';

        const card = document.getElementById('closedCard');
        let iconClass, iconName, dividerClass, title, description, dateHTML = '';

        switch (reason) {
            case 'not-open-yet':
                iconClass = 'icon-not-open';
                iconName = 'clock';
                dividerClass = 'divider-yellow';
                title = 'Pendaftaran Belum Dibuka';
                description = `Pendaftaran untuk <strong>${workshopName}</strong> belum dibuka saat ini. Pantau terus media sosial kami untuk info pembukaan! 🐾`;
                if (workshop && workshop.openDate) {
                    dateHTML = `
                        <div class="date-info">
                            <i data-lucide="calendar"></i>
                            Dibuka: ${formatDateIndo(workshop.openDate)}
                        </div>`;
                }
                break;

            case 'closed':
                iconClass = 'icon-closed';
                iconName = 'calendar-x';
                dividerClass = 'divider-red';
                title = 'Pendaftaran Telah Ditutup';
                description = `Maaf, pendaftaran untuk <strong>${workshopName}</strong> sudah ditutup. Terima kasih atas antusiasme kalian! 🐾`;
                if (workshop && workshop.closeDate) {
                    dateHTML = `
                        <div class="date-info">
                            <i data-lucide="calendar-x-2"></i>
                            Ditutup: ${formatDateIndo(workshop.closeDate)}
                        </div>`;
                }
                break;

            case 'sold-out':
                iconClass = 'icon-closed';
                iconName = 'ticket-x';
                dividerClass = 'divider-red';
                title = 'Kuota Sudah Penuh!';
                description = `Maaf, semua tiket untuk <strong>${workshopName}</strong> sudah terisi. Terima kasih atas antusiasme kalian! 🐾`;
                break;

            default: // disabled
                iconClass = 'icon-disabled';
                iconName = 'lock';
                dividerClass = 'divider-gray';
                title = 'Pendaftaran Ditutup';
                description = `Pendaftaran untuk <strong>${workshopName}</strong> saat ini sedang tidak dibuka. Pantau terus media sosial kami untuk info workshop selanjutnya! 🐾`;
                break;
        }

        // Pendaftaran ditutup/kuota penuh (icon-closed) -- ganti ikon bulet
        // jadi Mochi sedih, lebih "kena" daripada ikon doang buat momen nolak orang.
        const iconOrMochi = iconClass === 'icon-closed'
            ? `<img class="closed-mochi" src="images/sticker/mochi_sad.png" alt="">`
            : `<div class="icon-wrap ${iconClass}"><i data-lucide="${iconName}"></i></div>`;

        card.innerHTML = `
            ${iconOrMochi}
            <h2>${title}</h2>
            <div class="divider ${dividerClass}"></div>
            <p class="desc">${description}</p>
            ${dateHTML}
            <p class="see-you">Sampai ketemu di kesempatan berikutnya! ✨</p>
            <a href="index.html" class="back-btn"><i data-lucide="arrow-left"></i> Kembali ke Home</a>
            <div class="social-links">
                <a href="https://www.instagram.com/seminggu_satu" target="_blank" rel="noopener" class="social-btn">
                    <img src="images/instagram-64.png" alt="" width="16" height="16"> Follow Instagram
                </a>
                <a href="https://www.tiktok.com/@seminggusatu" target="_blank" rel="noopener" class="social-btn">
                    <img src="images/tiktok-64.png" alt="" width="16" height="16"> TikTok
                </a>
            </div>
        `;

        lucide.createIcons();
    </script>
</body>

</html>
