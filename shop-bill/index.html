<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagihanku — Seminggu Satu</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0046ff" data-light="#0046ff" data-dark="#0d1526">

    <script src="../theme.js"></script>
    <script src="../env.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        :root {
            --blue: #0046ff;
            --yellow: #ffe600;
            --ink: #10245e;
            --bg: #f4f7ff;
            --card: #ffffff;
            --line: #e4e9f5;
            --muted: #6b7794;
        }
        :root[data-theme="dark"] { --ink: #eaeffc; --bg: #0d1526; --card: #172035; --line: #2a3550; --muted: #9fabc9; }

        body { font-family: 'Open Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

        .wrap { max-width: 460px; margin: 0 auto; padding: 1.75rem 1.1rem 3rem; }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,30,120,.08);
            margin-bottom: 1rem;
        }

        h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.1rem; }

        .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
        .item-row:last-child { border-bottom: none; }
        .item-name { font-weight: 700; }
        .item-sub { font-size: 0.8rem; color: var(--muted); }
        .item-total { font-weight: 800; font-family: 'Outfit', sans-serif; white-space: nowrap; }
        .item-del { background: none; border: none; color: #b91c1c; font-size: 0.78rem; font-weight: 700; cursor: pointer; padding: 4px 0; }

        .total-row { display: flex; justify-content: space-between; align-items: center; padding-top: 0.9rem; margin-top: 0.4rem; border-top: 2px solid var(--line); }
        .total-row span:first-child { font-weight: 800; }
        .total-row b { font-family: 'Outfit', sans-serif; font-size: 1.3rem; color: var(--blue); }

        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            font-size: 1rem;
            padding: 0.8rem;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--card);
            color: var(--ink);
            margin-bottom: 0.9rem;
        }
        input[type="text"]:focus { outline: none; border-color: var(--blue); }

        .btn {
            width: 100%;
            padding: 0.95rem;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 13px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-wa { background: #25D366; }
        .btn-ghost { background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); margin-top: 0.6rem; }

        .msg { margin-top: 1rem; font-size: 0.88rem; text-align: center; }
        .msg.err { color: #b91c1c; }
        .msg.ok { color: #166534; font-weight: 700; }

        .state-box { text-align: center; padding: 2rem 1rem; }
        .state-box i { width: 36px; height: 36px; color: var(--muted); margin-bottom: 0.75rem; }
        .state-box h3 { font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 0.4rem; }
        .state-box p { color: var(--muted); font-size: 0.88rem; }

        .paid-badge { display: inline-block; background: #dcfce7; color: #166534; font-size: 0.78rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; margin-bottom: 1rem; }

        .bank-box { background: var(--bg); border: 1.5px dashed var(--line); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 1rem; }
        .bank-box-title { font-weight: 800; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .bank-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bank-name { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
        .bank-acc { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.5px; }
        .bank-owner { font-size: 0.78rem; color: var(--muted); }
        .copy-btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 0.5rem 0.8rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; font-family: inherit; }
        .copy-btn:active { transform: scale(0.96); }

        .name-suggest-wrap { position: relative; }
        .name-suggest-dropdown {
            display: none;
            position: absolute;
            top: calc(100% - 0.6rem);
            left: 0;
            right: 0;
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0,30,120,.14);
            max-height: 230px;
            overflow-y: auto;
            z-index: 20;
        }
        .name-suggest-item { padding: 0.7rem 0.9rem; font-size: 0.95rem; cursor: pointer; border-bottom: 1px solid var(--line); }
        .name-suggest-item:last-child { border-bottom: none; }
        .name-suggest-item:active, .name-suggest-item.hi { background: var(--bg); }

        /* ===== Belanja per event (?e=<batch_id>) ===== */
        .wrap.has-cartbar { padding-bottom: 7rem; }
        .prod-row { display: flex; align-items: center; gap: 12px; padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
        .prod-row:last-child { border-bottom: none; }
        .prod-img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .prod-info { flex: 1; min-width: 0; }
        .prod-name { font-weight: 700; line-height: 1.3; }
        .prod-price { font-family: 'Outfit', sans-serif; font-weight: 800; color: var(--blue); margin-top: 2px; }
        .prod-stock { font-size: 0.76rem; color: var(--muted); margin-top: 1px; }
        .prod-soldout { display: inline-block; font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); }
        .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .step-btn { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.2rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .1s, background .15s; font-family: inherit; }
        .step-btn:active { transform: scale(0.92); }
        .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .step-btn.plus { background: var(--blue); border-color: var(--blue); color: #fff; }
        .step-qty { min-width: 22px; text-align: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem; }
        .add-btn { padding: 0.6rem 0.95rem; border-radius: 12px; border: none; background: var(--blue); color: #fff; font-weight: 800; font-size: 0.85rem; cursor: pointer; font-family: inherit; white-space: nowrap; transition: transform .1s; }
        .add-btn:active { transform: scale(0.95); }
        .cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
        :root[data-theme="dark"] .cartbar { background: rgba(13,21,38,0.92); }
        .cartbar-inner { max-width: 460px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .cartbar-count { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
        .cartbar-total { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; }
        .cartbar .btn { width: auto; padding: 0.8rem 1.2rem; }
        .qris-box { text-align: center; margin-bottom: 1rem; }
        .qris-box img { width: 100%; max-width: 240px; border-radius: 14px; border: 1px solid var(--line); background: #fff; }
        .qris-box .bank-box-title { margin-bottom: 0.6rem; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card" id="cardBox">
            <div class="state-box" id="loadingBox">
                <p>Memuat…</p>
            </div>
        </div>
    </div>

    <script>
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function rupiah(n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }

        const ARNOLD_WA = "6281214574782";
        const BILL_KEY = "ss_shop_bill_id";
        const BANK_NAME = "Blu by BCA Digital";
        const BANK_ACCOUNT_NUMBER = "090163537583";
        const BANK_OWNER = "a.n Arnold Therigan";

        const PARAMS = new URLSearchParams(location.search);
        // ?e=<batch_id> = belanja per EVENT (satu QR per event, pilih produk
        // sendiri). ?o=<order_id> = tagihan/invoice. Tanpa dua-duanya =
        // tagihan lama yang lagi jalan di HP ini (alur QR per produk).
        const eventId = PARAMS.get('e') || '';
        let orderId = PARAMS.get('o') || (eventId ? '' : (function () {
            try { return localStorage.getItem(BILL_KEY) || ""; } catch (e) { return ""; }
        })());

        const cardBox = document.getElementById('cardBox');
        let CURRENT_BILL = null;

        function renderError(message) {
            cardBox.innerHTML =
                '<div class="state-box"><i data-lucide="receipt-text"></i><h3>Nggak Ketemu</h3><p>' + esc(message) + '</p></div>';
            if (window.lucide) lucide.createIcons();
        }

        // Dropdown "Event" + rekomendasi nama -- SEMUA tipe workshop (bukan
        // reka-rekat doang), batch yang event_date-nya "relevan" (sekitar
        // hari ini -- backend yang nentuin jendela waktunya, BUKAN ngandelin
        // flag `active` yang suka nggak kebalikin false abis event lewat).
        // Auto-pilih batch yang event_date-nya = hari ini (kalau 2+ samaan
        // tanggal, yang PALING ATAS/awal di hasil urutan backend yang menang).
        //
        // Daftar nama DI-SCOPE ke batch yang lagi KEPILIH aja (bukan digabung
        // semua batch) -- biar peserta satu event nggak keliatan daftar nama
        // peserta event LAIN. Ganti Event di dropdown = daftar nama ikut
        // di-refresh ke batch itu.
        let CONTEXT_BATCHES = [];
        let selectedBatchId = null; // null = belum pernah di-set (beda sama "" = sengaja kosong)
        let ALL_PARTICIPANTS = []; // peserta MENTAH dari semua batch (belum di-scope)
        let participantsByKey = {}; // nama (lengkap/nickname) -> {id, batchId} -- CUMA peserta batch yang lagi kepilih

        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function formatEventDate(d) {
            if (!d) return '';
            try {
                return new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch (e) { return d; }
        }

        function waDisplay(wa) {
            const d = String(wa || '').replace(/\D/g, '');
            return d.indexOf('62') === 0 ? '0' + d.slice(2) : d;
        }

        let checkoutContextPromise = null;
        function loadCheckoutContext() {
            if (!checkoutContextPromise) {
                checkoutContextPromise = apiCall({ action: 'getCheckoutContext' })
                    .then(body => (body.status === 'success') ? body : { batches: [], participants: [], failed: true })
                    .catch(() => ({ batches: [], participants: [], failed: true }));
            }
            return checkoutContextPromise;
        }

        // Daftar nama di-scope ke batch yang LAGI kepilih aja -- dipanggil
        // ulang tiap Event di dropdown diganti.
        function rebuildParticipantsByKey() {
            participantsByKey = {};
            if (!selectedBatchId) return; // "(Bukan peserta / pilih manual)" -> nggak ada rekomendasi nama
            ALL_PARTICIPANTS.filter(p => p.batchId === selectedBatchId).forEach(p => {
                if (p.fullName) participantsByKey[p.fullName] = p;
                if (p.nickname) participantsByKey[p.nickname] = p;
            });
        }

        async function populateEventAndNames() {
            const evSel = document.getElementById('eventSelect');
            if (!evSel) return;
            const ctx = await loadCheckoutContext();
            CONTEXT_BATCHES = ctx.batches || [];
            ALL_PARTICIPANTS = ctx.participants || [];

            if (selectedBatchId === null) {
                const today = todayStr();
                const todayMatch = CONTEXT_BATCHES.find(b => b.eventDate === today);
                selectedBatchId = todayMatch ? todayMatch.id : "";
            }
            rebuildParticipantsByKey();

            if (ctx.failed) {
                evSel.innerHTML = '<option value="">(Gagal memuat daftar event -- coba reload halaman ini)</option>';
                evSel.disabled = true;
                return;
            }
            evSel.disabled = false;
            evSel.innerHTML = '<option value="">(Bukan peserta / pilih manual)</option>' +
                CONTEXT_BATCHES.map(b =>
                    '<option value="' + esc(b.id) + '">' + esc(b.workshopName) + ' - ' + esc(b.label) +
                    (b.eventDate ? ' (' + esc(formatEventDate(b.eventDate)) + ')' : '') + '</option>'
                ).join('');
            evSel.value = selectedBatchId || '';
            evSel.addEventListener('change', () => {
                selectedBatchId = evSel.value;
                rebuildParticipantsByKey();
                // kalau dropdown nama lagi kebuka, tutup -- daripada nunjukin
                // daftar nama basi dari Event sebelumnya sampe diketik ulang.
                const dd = document.getElementById('nameSuggestDropdown');
                if (dd) dd.style.display = 'none';
            });
        }

        async function apiCall(payload) {
            const res = await fetch(SUPABASE_URL + '/functions/v1/shop-bill', {
                method: 'POST',
                headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        function buildWaText(bill, eventInfo) {
            const itemsText = bill.items.map(it => '- ' + it.productName + ' x' + it.qty + ' = ' + rupiah(it.lineTotal)).join('\n');
            const eventPhrase = eventInfo ? (' di ' + eventInfo.workshopName + (eventInfo.label ? ' - ' + eventInfo.label : '')) : '';
            const invoiceLink = location.href.split('?')[0] + '?o=' + orderId;
            return 'Halo Arnold! Aku ' + bill.buyerName + ', mau checkout belanja' + eventPhrase + ':\n' + itemsText +
                '\n\nTotal: ' + rupiah(bill.total) +
                '\n\nLink Invoice: ' + invoiceLink;
        }

        // Tagihan yang UDAH di-checkout (checkedOutAt kesisi) -- kalau link-nya
        // dibuka lagi (Arnold ngecek dari WA, pembeli buka ulang, dst), ini
        // harus nunjukin invoice READ-ONLY, bukan form checkout yang masih
        // bisa diedit kayak belum pernah di-checkout.
        function renderInvoice(bill) {
            const itemsHtml = bill.items.length
                ? bill.items.map(it =>
                    '<div class="item-row">' +
                    '<div><div class="item-name">' + esc(it.productName) + '</div>' +
                    '<div class="item-sub">' + it.qty + ' &times; ' + rupiah(it.unitSellPrice) + '</div></div>' +
                    '<div class="item-total">' + rupiah(it.lineTotal) + '</div>' +
                    '</div>'
                ).join("")
                : '<p class="sub" style="margin:0;">Tagihan ini kosong.</p>';
            const eventLine = bill.event ? (esc(bill.event.workshopName) + (bill.event.label ? ' - ' + esc(bill.event.label) : '')) : '';

            cardBox.innerHTML =
                '<h1>Invoice Belanja</h1>' +
                '<p class="sub">' + esc(bill.buyerName) + (eventLine ? ' &middot; ' + eventLine : '') + '</p>' +
                (bill.isPaid
                    ? '<div class="paid-badge">✓ Sudah Dikonfirmasi Lunas</div>'
                    : '<div class="paid-badge" style="background:#fef9c3;color:#854d0e;">Menunggu Konfirmasi Pembayaran</div>') +
                itemsHtml +
                '<div class="total-row"><span>Total</span><b>' + rupiah(bill.total) + '</b></div>';
            if (window.lucide) lucide.createIcons();

            const actionCard = document.createElement('div');
            actionCard.className = 'card';
            const qris = (bill.event && !bill.isPaid) ? bill.event.qrisImage : '';
            const shopAgainId = bill.event && bill.event.batchId;
            actionCard.innerHTML =
                (bill.isPaid ? '' : paymentHtml(qris, 'Transfer ke rekening ini')) +
                (bill.buyerWa ? '<p class="sub">WA: ' + esc(waDisplay(bill.buyerWa)) + '</p>' : '') +
                '<button class="btn btn-wa" id="resendBtn" type="button"><i data-lucide="send"></i> Kirim Ulang ke WA</button>' +
                (shopAgainId
                    ? '<a class="btn btn-ghost" style="text-decoration:none;" href="?e=' + encodeURIComponent(shopAgainId) + '">Belanja Lagi</a>'
                    : '<button class="btn btn-ghost" id="newBillBtn" type="button">Mulai Tagihan Baru</button>') +
                '<div class="msg" id="checkoutMsg"></div>';
            cardBox.insertAdjacentElement('afterend', actionCard);
            if (window.lucide) lucide.createIcons();
            wireCopyBank();
            const resendBtn = document.getElementById('resendBtn');
            if (resendBtn) {
                resendBtn.addEventListener('click', () => {
                    window.open('https://wa.me/' + ARNOLD_WA + '?text=' + encodeURIComponent(buildWaText(bill, bill.event)), '_blank');
                });
            }
            const newBillBtn = document.getElementById('newBillBtn');
            if (newBillBtn) newBillBtn.addEventListener('click', startNewBill);
        }

        function render(bill) {
            CURRENT_BILL = bill;
            if (bill.checkedOutAt) { renderInvoice(bill); return; }
            const nameSet = bill.buyerName && bill.buyerName !== "Pembeli (belum isi nama)";
            const itemsHtml = bill.items.length
                ? bill.items.map(it =>
                    '<div class="item-row">' +
                    '<div><div class="item-name">' + esc(it.productName) + '</div>' +
                    '<div class="item-sub">' + it.qty + ' &times; ' + rupiah(it.unitSellPrice) + '</div>' +
                    (bill.isPaid ? '' : '<button class="item-del" data-id="' + esc(it.id) + '">Hapus</button>') +
                    '</div>' +
                    '<div class="item-total">' + rupiah(it.lineTotal) + '</div>' +
                    '</div>'
                ).join("")
                : '<p class="sub" style="margin:0;">Belum ada item. Scan QR produk buat nambahin.</p>';

            cardBox.innerHTML =
                '<h1>Tagihanku</h1>' +
                '<p class="sub">Reka Rekat -- cek rincian belanjamu di sini.</p>' +
                (bill.isPaid ? '<div class="paid-badge">✓ Sudah Dikonfirmasi Lunas</div>' : '') +
                itemsHtml +
                '<div class="total-row"><span>Total</span><b>' + rupiah(bill.total) + '</b></div>' +
                '<div id="billMsg" class="msg"></div>';
            if (window.lucide) lucide.createIcons();

            cardBox.querySelectorAll('[data-id]').forEach(btn => {
                btn.addEventListener('click', () => removeItem(btn.dataset.id));
            });

            const checkoutCard = document.createElement('div');
            checkoutCard.className = 'card';
            if (!bill.items.length) {
                checkoutCard.innerHTML = '<p class="sub" style="margin:0;">Tagihan masih kosong -- scan QR produk yang mau kamu beli dulu ya.</p>';
            } else {
                checkoutCard.innerHTML =
                    '<label for="eventSelect">Event</label>' +
                    '<select id="eventSelect" style="width:100%;font-size:1rem;padding:0.8rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:0.9rem;"><option>Memuat…</option></select>' +
                    '<div class="bank-box">' +
                    '<div class="bank-box-title">💳 Transfer dulu ke rekening ini</div>' +
                    '<div class="bank-row"><div>' +
                    '<div class="bank-name">' + esc(BANK_NAME) + '</div>' +
                    '<div class="bank-acc">' + esc(BANK_ACCOUNT_NUMBER) + '</div>' +
                    '<div class="bank-owner">' + esc(BANK_OWNER) + '</div>' +
                    '</div><button class="copy-btn" id="copyBankBtn" type="button">Salin</button></div>' +
                    '</div>' +
                    '<label for="nameInput">Nama Kamu</label>' +
                    '<div class="name-suggest-wrap">' +
                    '<input type="text" id="nameInput" autocomplete="off" placeholder="Nama buat invoice" value="' + (nameSet ? esc(bill.buyerName) : '') + '">' +
                    '<div class="name-suggest-dropdown" id="nameSuggestDropdown"></div>' +
                    '</div>' +
                    '<label for="waInput">Nomor WA (opsional)</label>' +
                    '<input type="text" id="waInput" placeholder="08xx..." value="' + esc(bill.buyerWa || '') + '">' +
                    '<button class="btn btn-wa" id="checkoutBtn" type="button"><i data-lucide="send"></i> WA Arnold untuk Konfirmasi</button>' +
                    '<button class="btn btn-ghost" id="newBillBtn" type="button">Mulai Tagihan Baru</button>' +
                    '<div class="msg" id="checkoutMsg"></div>';
            }
            cardBox.insertAdjacentElement('afterend', checkoutCard);
            if (window.lucide) lucide.createIcons();
            populateEventAndNames();

            wireNameSuggest(document.getElementById('nameInput'), document.getElementById('nameSuggestDropdown'));
            const checkoutBtn = document.getElementById('checkoutBtn');
            if (checkoutBtn) checkoutBtn.addEventListener('click', checkout);
            const newBillBtn = document.getElementById('newBillBtn');
            if (newBillBtn) newBillBtn.addEventListener('click', startNewBill);
            const copyBankBtn = document.getElementById('copyBankBtn');
            if (copyBankBtn) {
                copyBankBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(BANK_ACCOUNT_NUMBER).then(() => {
                        const old = copyBankBtn.textContent;
                        copyBankBtn.textContent = 'Tersalin!';
                        setTimeout(() => { copyBankBtn.textContent = old; }, 1500);
                    }).catch(() => { alert('Nomor rekening: ' + BANK_ACCOUNT_NUMBER); });
                });
            }
        }

        // Dropdown custom gantiin <datalist> -- <datalist> hampir nggak
        // kelihatan di Safari iOS (cuma strip "AutoFill" tipis di atas
        // keyboard, bukan daftar beneran), jadi suggestion-nya dirender
        // manual di sini, tetep bisa diketik bebas juga. Sumber nama =
        // participantsByKey (udah di-scope ke satu batch).
        function wireNameSuggest(nameInput, nameDropdown) {
            if (!nameInput || !nameDropdown) return;
            function renderNameSuggestions() {
                const q = nameInput.value.trim().toLowerCase();
                // participantsByKey nyimpen nama lengkap & nickname sebagai 2
                // key yang nunjuk ke peserta yang SAMA -- dedupe per id biar
                // satu orang cuma muncul sekali (dulu "Febrina P" + "Febri"
                // muncul dobel). Tetep bisa dicari pake salah satunya.
                const seen = new Set();
                const people = Object.values(participantsByKey).filter(pp => {
                    if (seen.has(pp.id)) return false;
                    seen.add(pp.id);
                    return true;
                });
                const display = pp => pp.fullName || pp.nickname;
                const hit = pp => [pp.fullName, pp.nickname].some(n => n && n.toLowerCase().includes(q));
                const starts = pp => [pp.fullName, pp.nickname].some(n => n && n.toLowerCase().startsWith(q));
                let matches = q ? people.filter(hit) : people;
                matches.sort((a, b) => {
                    const aw = starts(a) ? 0 : 1, bw = starts(b) ? 0 : 1;
                    return aw !== bw ? aw - bw : display(a).localeCompare(display(b));
                });
                matches = matches.slice(0, 8);
                if (!matches.length) { nameDropdown.style.display = 'none'; nameDropdown.innerHTML = ''; return; }
                nameDropdown.innerHTML = matches.map(pp => {
                    const main = display(pp);
                    const nick = pp.fullName && pp.nickname && pp.nickname.toLowerCase() !== pp.fullName.toLowerCase() ? pp.nickname : '';
                    return '<div class="name-suggest-item" data-name="' + esc(main) + '">' + esc(main) +
                        (nick ? ' <span style="color:var(--muted);font-size:0.85em;">(' + esc(nick) + ')</span>' : '') + '</div>';
                }).join('');
                nameDropdown.style.display = 'block';
                nameDropdown.querySelectorAll('[data-name]').forEach(el => {
                    // mousedown (bukan click) -- jalan SEBELUM blur nutup dropdown-nya
                    el.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        nameInput.value = el.dataset.name;
                        nameDropdown.style.display = 'none';
                    });
                });
            }
            nameInput.addEventListener('input', renderNameSuggestions);
            nameInput.addEventListener('focus', renderNameSuggestions);
            nameInput.addEventListener('blur', () => { setTimeout(() => { nameDropdown.style.display = 'none'; }, 150); });
        }

        // Kotak pembayaran -- QRIS batch (kalau Arnold udah upload) + rekening.
        function paymentHtml(qrisImage, title) {
            return (qrisImage
                ? '<div class="qris-box"><div class="bank-box-title">📱 Scan QRIS</div><img src="' + esc(qrisImage) + '" alt="QRIS pembayaran"></div>'
                : '') +
                '<div class="bank-box">' +
                '<div class="bank-box-title">💳 ' + esc(qrisImage ? 'Atau transfer ke rekening ini' : title) + '</div>' +
                '<div class="bank-row"><div>' +
                '<div class="bank-name">' + esc(BANK_NAME) + '</div>' +
                '<div class="bank-acc">' + esc(BANK_ACCOUNT_NUMBER) + '</div>' +
                '<div class="bank-owner">' + esc(BANK_OWNER) + '</div>' +
                '</div><button class="copy-btn" id="copyBankBtn" type="button">Salin</button></div>' +
                '</div>';
        }
        function wireCopyBank() {
            const copyBankBtn = document.getElementById('copyBankBtn');
            if (!copyBankBtn) return;
            copyBankBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(BANK_ACCOUNT_NUMBER).then(() => {
                    const old = copyBankBtn.textContent;
                    copyBankBtn.textContent = 'Tersalin!';
                    setTimeout(() => { copyBankBtn.textContent = old; }, 1500);
                }).catch(() => { alert('Nomor rekening: ' + BANK_ACCOUNT_NUMBER); });
            });
        }

        async function load() {
            cardBox.innerHTML = '<div class="state-box"><p>Memuat…</p></div>';
            document.querySelectorAll('.card').forEach((el, i) => { if (i > 0) el.remove(); });
            if (!orderId) { renderError('Belum ada tagihan. Scan QR produk dulu ya.'); return; }
            try {
                const body = await apiCall({ action: 'getBill', orderId });
                if (body.status === 'error') { renderError(body.message || 'Tagihan nggak ketemu.'); return; }
                render(body.bill);
            } catch (e) {
                renderError('Koneksi gagal. Coba reload halaman ini.');
            }
        }

        async function removeItem(itemId) {
            const msg = document.getElementById('billMsg');
            msg.className = 'msg'; msg.textContent = 'Menghapus…';
            try {
                const body = await apiCall({ action: 'removeItem', orderId, itemId });
                if (body.status === 'error') { msg.className = 'msg err'; msg.textContent = body.message || 'Gagal menghapus.'; return; }
                document.querySelectorAll('.card').forEach((el, i) => { if (i > 0) el.remove(); });
                render(body.bill);
            } catch (e) {
                msg.className = 'msg err'; msg.textContent = 'Koneksi gagal.';
            }
        }

        async function checkout() {
            const nameInput = document.getElementById('nameInput');
            const waInput = document.getElementById('waInput');
            const btn = document.getElementById('checkoutBtn');
            const msg = document.getElementById('checkoutMsg');
            const name = nameInput.value.trim();
            if (!name) { msg.className = 'msg err'; msg.textContent = 'Isi namamu dulu ya.'; nameInput.focus(); return; }
            btn.disabled = true;
            msg.className = 'msg'; msg.textContent = 'Menyimpan…';
            try {
                const matched = participantsByKey[name];
                const wa = waInput.value.trim();
                const batch = CONTEXT_BATCHES.find(b => b.id === selectedBatchId) || null;
                const payload = { action: 'setBuyer', orderId, buyerName: name, buyerWa: wa };
                if (selectedBatchId) {
                    payload.batchId = selectedBatchId;
                    if (batch) payload.workshopType = batch.workshopType;
                }
                if (matched) payload.registrationId = matched.id;
                const body = await apiCall(payload);
                if (body.status === 'error') { msg.className = 'msg err'; msg.textContent = body.message || 'Gagal menyimpan.'; btn.disabled = false; return; }
                const bill = body.bill;
                try { localStorage.removeItem(BILL_KEY); } catch (e) { }
                window.open('https://wa.me/' + ARNOLD_WA + '?text=' + encodeURIComponent(buildWaText(bill, bill.event)), '_blank');
                // Checkout sukses -> tagihan ini sekarang "checkedOutAt" kesisi
                // di backend, render ulang buat langsung pindah ke tampilan
                // invoice read-only (bukan nahan di form checkout).
                document.querySelectorAll('.card').forEach((el, i) => { if (i > 0) el.remove(); });
                render(bill);
            } catch (e) {
                msg.className = 'msg err'; msg.textContent = 'Koneksi gagal. Coba lagi.';
                btn.disabled = false;
            }
        }

        function startNewBill() {
            if (!confirm('Mulai tagihan baru? Tagihan ini masih bisa diakses lewat link-nya kalau disimpan.')) return;
            try { localStorage.removeItem(BILL_KEY); } catch (e) { }
            renderError('Tagihan baru siap -- scan QR produk buat mulai belanja lagi.');
        }

        // ===================== Belanja per EVENT =====================
        let EV = null;        // { event, products, participants } dari getEventShop
        let CART = {};        // productId -> qty
        const CART_KEY = 'ss_event_cart_' + eventId;
        function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(CART)); } catch (e) { } }
        function readCart() { try { return JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch (e) { return {}; } }

        // Rapihin keranjang sesuai stok terbaru (barang bisa keburu dibeli
        // orang lain / dihapus Arnold dari daftar event).
        function clampCart() {
            const byId = new Map(EV.products.map(p => [p.productId, p]));
            Object.keys(CART).forEach(id => {
                const p = byId.get(id);
                if (!p || p.available <= 0 || !(CART[id] > 0)) delete CART[id];
                else CART[id] = Math.min(CART[id], p.available);
            });
            saveCart();
        }
        function cartLines() {
            return EV.products.filter(p => CART[p.productId] > 0)
                .map(p => ({ productId: p.productId, name: p.name, qty: CART[p.productId], price: p.sellPrice, lineTotal: CART[p.productId] * p.sellPrice }));
        }

        async function fetchEventShop() {
            const body = await apiCall({ action: 'getEventShop', batchId: eventId });
            if (body.status === 'error') throw new Error(body.message || 'Event nggak ketemu.');
            return body;
        }

        async function loadEventShop() {
            cardBox.innerHTML = '<div class="state-box"><p>Sebentar ya, lagi nyiapin daftar produknya…</p></div>';
            try {
                EV = await fetchEventShop();
            } catch (e) {
                renderError(e.message === 'Failed to fetch' ? 'Koneksi gagal. Cek internetmu lalu muat ulang halaman ini.' : e.message);
                return;
            }
            participantsByKey = {};
            EV.participants.forEach(p => {
                if (p.fullName) participantsByKey[p.fullName] = p;
                if (p.nickname) participantsByKey[p.nickname] = p;
            });
            CART = readCart();
            clampCart();
            renderEventShop();
        }

        // Kerangka dirender SEKALI -- tombol +/- cuma nge-update bagian
        // produk & ringkasan, biar nama/WA yang lagi diketik nggak ke-reset.
        function renderEventShop() {
            const ev = EV.event;
            const dateTxt = ev.eventDate ? formatEventDate(ev.eventDate) : '';
            document.title = 'Belanja di ' + ev.workshopName + ' — Seminggu Satu';
            cardBox.innerHTML =
                '<h1>🛍️ Belanja di ' + esc(ev.workshopName) + '</h1>' +
                '<p class="sub">' + esc([ev.label, dateTxt].filter(Boolean).join(' · ')) + '</p>' +
                (EV.products.length
                    ? '<p class="sub" style="margin-top:-0.5rem;">Pilih barang yang mau kamu bawa pulang, terus checkout di bawah ya ✨</p><div id="evProducts"></div>'
                    : '<div class="state-box"><i data-lucide="package-open"></i><h3>Belum ada produk</h3><p>Produk buat event ini belum disiapin. Tanya Arnold langsung ya 🙌</p></div>');

            if (EV.products.length) {
                const checkoutCard = document.createElement('div');
                checkoutCard.className = 'card';
                checkoutCard.id = 'evCheckout';
                checkoutCard.innerHTML =
                    '<h1 style="font-size:1.1rem;">Checkout</h1>' +
                    '<div id="evSummary" style="margin-bottom:1rem;"></div>' +
                    '<label for="nameInput">Nama Kamu</label>' +
                    '<div class="name-suggest-wrap">' +
                    '<input type="text" id="nameInput" autocomplete="off" placeholder="Nama buat invoice">' +
                    '<div class="name-suggest-dropdown" id="nameSuggestDropdown"></div>' +
                    '</div>' +
                    '<label for="waInput">Nomor WA (opsional)</label>' +
                    '<input type="text" id="waInput" inputmode="tel" placeholder="08xx...">' +
                    paymentHtml(ev.qrisImage, 'Transfer ke rekening ini') +
                    '<button class="btn btn-wa" id="checkoutBtn" type="button"><i data-lucide="send"></i> WA Arnold untuk Konfirmasi</button>' +
                    '<div class="msg" id="checkoutMsg"></div>';
                cardBox.insertAdjacentElement('afterend', checkoutCard);

                const bar = document.createElement('div');
                bar.className = 'cartbar';
                bar.id = 'evCartBar';
                bar.innerHTML =
                    '<div class="cartbar-inner"><div><div class="cartbar-count" id="evBarCount"></div><div class="cartbar-total" id="evBarTotal"></div></div>' +
                    '<button class="btn" id="evBarBtn" type="button">Checkout</button></div>';
                document.body.appendChild(bar);
                document.getElementById('evBarBtn').addEventListener('click', () => {
                    checkoutCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                wireNameSuggest(document.getElementById('nameInput'), document.getElementById('nameSuggestDropdown'));
                wireCopyBank();
                document.getElementById('checkoutBtn').addEventListener('click', checkoutEvent);
            }
            if (window.lucide) lucide.createIcons();
            updateEventCart();
        }

        function updateEventCart() {
            const listEl = document.getElementById('evProducts');
            if (!listEl) return;
            listEl.innerHTML = EV.products.map(p => {
                const qty = CART[p.productId] || 0;
                const img = p.image
                    ? '<img class="prod-img" src="' + esc(p.image) + '" alt="" loading="lazy">'
                    : '<div class="prod-img">🛍️</div>';
                let ctrl;
                if (p.available <= 0) ctrl = '<span class="prod-soldout">Habis</span>';
                else if (!qty) ctrl = '<button class="add-btn" data-plus="' + esc(p.productId) + '" type="button">+ Tambah</button>';
                else ctrl = '<div class="stepper">' +
                    '<button class="step-btn" data-minus="' + esc(p.productId) + '" type="button" aria-label="Kurangi">−</button>' +
                    '<span class="step-qty">' + qty + '</span>' +
                    '<button class="step-btn plus" data-plus="' + esc(p.productId) + '" type="button" aria-label="Tambah"' + (qty >= p.available ? ' disabled' : '') + '>+</button>' +
                    '</div>';
                return '<div class="prod-row">' + img +
                    '<div class="prod-info"><div class="prod-name">' + esc(p.name) + '</div>' +
                    '<div class="prod-price">' + rupiah(p.sellPrice) + '</div>' +
                    (p.available > 0 ? '<div class="prod-stock">Sisa ' + p.available + '</div>' : '') +
                    '</div>' + ctrl + '</div>';
            }).join('');
            listEl.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => changeQty(b.dataset.plus, 1)));
            listEl.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', () => changeQty(b.dataset.minus, -1)));

            const lines = cartLines();
            const total = lines.reduce((s, l) => s + l.lineTotal, 0);
            const count = lines.reduce((s, l) => s + l.qty, 0);
            const checkoutCard = document.getElementById('evCheckout');
            const bar = document.getElementById('evCartBar');
            const has = lines.length > 0;
            if (checkoutCard) checkoutCard.style.display = has ? '' : 'none';
            if (bar) bar.style.display = has ? '' : 'none';
            document.querySelector('.wrap').classList.toggle('has-cartbar', has);
            if (!has) return;
            document.getElementById('evSummary').innerHTML =
                lines.map(l =>
                    '<div class="item-row"><div><div class="item-name">' + esc(l.name) + '</div>' +
                    '<div class="item-sub">' + l.qty + ' &times; ' + rupiah(l.price) + '</div></div>' +
                    '<div class="item-total">' + rupiah(l.lineTotal) + '</div></div>'
                ).join('') +
                '<div class="total-row"><span>Total</span><b>' + rupiah(total) + '</b></div>';
            document.getElementById('evBarCount').textContent = count + ' barang';
            document.getElementById('evBarTotal').textContent = rupiah(total);
        }

        function changeQty(productId, delta) {
            const p = EV.products.find(x => x.productId === productId);
            if (!p) return;
            const next = Math.max(0, Math.min((CART[productId] || 0) + delta, p.available));
            if (next) CART[productId] = next; else delete CART[productId];
            saveCart();
            updateEventCart();
        }

        async function checkoutEvent() {
            const nameInput = document.getElementById('nameInput');
            const waInput = document.getElementById('waInput');
            const btn = document.getElementById('checkoutBtn');
            const msg = document.getElementById('checkoutMsg');
            const name = nameInput.value.trim();
            if (!name) { msg.className = 'msg err'; msg.textContent = 'Isi namamu dulu ya.'; nameInput.focus(); return; }
            const lines = cartLines();
            if (!lines.length) { msg.className = 'msg err'; msg.textContent = 'Keranjangmu masih kosong.'; return; }
            btn.disabled = true;
            msg.className = 'msg'; msg.textContent = 'Menyimpan pesananmu…';
            try {
                const matched = participantsByKey[name];
                const body = await apiCall({
                    action: 'checkoutEvent', batchId: eventId, buyerName: name, buyerWa: waInput.value.trim(),
                    registrationId: matched ? matched.id : null,
                    items: lines.map(l => ({ productId: l.productId, qty: l.qty })),
                });
                if (body.status === 'error') {
                    // Kemungkinan besar stok keburu berubah -- segerin angka sisa
                    // & rapihin keranjang, tapi nama/WA yang udah diketik tetep.
                    try { EV = Object.assign(EV, await fetchEventShop()); clampCart(); updateEventCart(); } catch (e) { }
                    msg.className = 'msg err'; msg.textContent = body.message || 'Gagal menyimpan pesanan.';
                    btn.disabled = false;
                    return;
                }
                const bill = body.bill;
                orderId = bill.orderId;
                CART = {};
                try { localStorage.removeItem(CART_KEY); } catch (e) { }
                // URL jadi link invoice -- kalau di-refresh/dibuka lagi, yang
                // muncul invoice-nya, bukan katalog kosong.
                history.replaceState(null, '', location.pathname + '?o=' + encodeURIComponent(orderId));
                window.open('https://wa.me/' + ARNOLD_WA + '?text=' + encodeURIComponent(buildWaText(bill, bill.event)), '_blank');
                const bar = document.getElementById('evCartBar');
                if (bar) bar.remove();
                document.querySelector('.wrap').classList.remove('has-cartbar');
                document.querySelectorAll('.card').forEach((el, i) => { if (i > 0) el.remove(); });
                render(bill);
            } catch (e) {
                msg.className = 'msg err'; msg.textContent = 'Koneksi gagal. Coba lagi.';
                btn.disabled = false;
            }
        }

        if (eventId && !PARAMS.get('o')) {
            loadEventShop();
        } else {
            load();
            loadCheckoutContext();
        }
    </script>
</body>
