<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=../warga/">
<title>Balai Warga — Seminggu Satu</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f7ff; color: #1a1a2e; text-align: center; padding: 24px;
  }
  a { color: #0046ff; font-weight: 600; }
</style>
<script>
  (function () {
    // /sahabat udah diganti nama jadi /warga — bersihin SW & cache lama biar
    // yang sempet install PWA di sini otomatis kebawa pindah, bukan 404.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if ("caches" in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
    location.replace("../warga/" + location.search + location.hash);
  })();
</script>
</head>
<body>
  <p>Halaman ini udah pindah. Kalau nggak otomatis kebawa, klik <a href="../warga/">di sini</a>.</p>
</body>
</html>
