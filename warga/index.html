<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Balai Warga lagi maintenance — Seminggu Satu</title>
    <meta name="description" content="Balai Warga lagi maintenance karena migrasi sistem. Balik lagi sebentar lagi ya!">
    <meta name="theme-color" content="#0046ff" data-light="#0046ff" data-dark="#0d1526">

    <script src="../theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #0046ff;
            --blue-2: #0092ff;
            --yellow: #ffe600;
            --ink: #10245e;
            --bg: #f4f7ff;
            --card: #ffffff;
            --line: #e4e9f5;
            --muted: #6b7794;
        }

        :root[data-theme="dark"] {
            --blue: #5b8cff;
            --blue-2: #47a6ff;
            --ink: #eaeffc;
            --bg: #0d1526;
            --card: #172035;
            --line: #2a3550;
            --muted: #9fabc9;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 2.25rem 1.75rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 30, 120, .12);
        }

        .card img.logo {
            height: 40px;
            width: auto;
            margin-bottom: 1.5rem;
        }

        .badge-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .badge {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(155deg, #0043f5 0%, #0092ff 55%, #00b4ff 100%);
            box-shadow: 0 18px 45px rgba(0, 60, 200, .28);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            line-height: 1.35;
            margin-bottom: .6rem;
        }

        p {
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: #fef9c3;
            color: #854d0e;
            font-weight: 700;
            font-size: .8rem;
            padding: .45rem .9rem;
            border-radius: 999px;
            margin-bottom: 1.5rem;
        }

        :root[data-theme="dark"] .pill {
            background: #3a3010;
            color: #ffe082;
        }

        .home-btn {
            display: inline-block;
            width: 100%;
            background: var(--blue);
            color: #fff;
            font-weight: 800;
            font-size: .95rem;
            text-decoration: none;
            padding: .9rem;
            border-radius: 13px;
            transition: transform .15s ease, opacity .15s ease;
        }

        .home-btn:hover { opacity: .92; }
        .home-btn:active { transform: scale(.98); }
    </style>
</head>

<body>
    <div class="card">
        <img class="logo" src="../logo_seminggu.png" alt="Seminggu Satu">
        <div class="badge-wrap">
            <div class="badge">🛠️</div>
        </div>
        <span class="pill">✨ Lagi Maintenance</span>
        <h1>Balai Warga lagi beres-beres dulu</h1>
        <p>Kami lagi migrasi sistem biar Balai Warga makin kenceng & stabil. Halaman ini sementara nggak bisa diakses — balik lagi sebentar lagi ya!</p>
        <a class="home-btn" href="../">Balik ke Beranda</a>
    </div>
</body>

</html>
